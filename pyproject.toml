[project]
name = "visual-generator"
version = "0.1.0"
description = "Data-driven visual generator: JSON + template + art + text sections, OCR-verifiable"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "merlin-pinpin-org" }]
dependencies = ["pillow>=10.0.0", "matplotlib>=3.7.0"]

[project.scripts]
vg-render = "engine.render:main"
vg-ocr-check = "tools.ocr_check:main"
vg-demo-assets = "tools.make_demo_assets:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine", "templates", "tools"]

[tool.hatch.build]
exclude = ["examples", "data", ".agents"]
